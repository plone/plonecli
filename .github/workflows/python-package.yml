# This workflow will install Python dependencies, run tests and lint with a variety of Python versions
# For more information see: https://help.github.com/actions/language-and-framework-guides/using-python-with-github-actions

name: Python package

on:
    push:
        branches: [master]
    pull_request:
        branches: [master]

jobs:
    build:
        runs-on: ubuntu-latest
        strategy:
            fail-fast: false
            matrix:
                python-version: ["3.11", "3.12", "3.13", "3.14"]

        steps:
            - uses: actions/checkout@v2
            - name: Checkout copier-templates
              env:
                  TEMPLATES_BRANCH: ${{ github.head_ref || github.ref_name }}
              run: |
                  # Use a copier-templates branch matching this PR's branch when it
                  # exists (coordinated cross-repo changes), else the default branch.
                  git clone --depth 1 --branch "$TEMPLATES_BRANCH" \
                      https://github.com/plone/copier-templates copier-templates \
                      || git clone --depth 1 \
                      https://github.com/plone/copier-templates copier-templates
            - name: Set up Python ${{ matrix.python-version }}
              uses: actions/setup-python@v2
              with:
                  python-version: ${{ matrix.python-version }}
            - name: Set up uv
              uses: astral-sh/setup-uv@v5
            - name: Install dependencies
              run: |
                  python -m pip install --upgrade pip
                  pip install flake8 pytest
                  if [ -f requirements.txt ]; then pip install -r requirements.txt; fi
                  pip install -e .[test]
            - name: Lint with flake8
              run: |
                  # stop the build if there are Python syntax errors or undefined names
                  flake8 . --exclude=copier-templates --count --select=E9,F63,F7,F82 --show-source --statistics
                  # exit-zero treats all errors as warnings. The GitHub editor is 127 chars wide
                  flake8 . --exclude=copier-templates --count --exit-zero --max-complexity=10 --max-line-length=127 --statistics
            - name: Test with pytest
              env:
                  PLONECLI_TEMPLATES_DIR: ${{ github.workspace }}/copier-templates
              run: |
                  pytest
